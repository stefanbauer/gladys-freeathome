name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact release commit to check
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - name: Validate metadata without requiring a published image
        run: npx --yes github:GladysAssistant/integration-store --skip-image-check .

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build production image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: gladys-freeathome-ci:check
      - name: Test packaged runtime offline under Gladys limits
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 256m --cpus 0.5 --pids-limit 100 \
            --mount "type=bind,src=$PWD/test,dst=/app/test,readonly" \
            gladys-freeathome-ci:check node --test test/app.test.js test/controller.test.js
